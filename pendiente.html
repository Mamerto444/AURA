<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tarjeta pendiente de activación — TapGo</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0c">
<style>
  :root {
    --bg-deep: #0a0a0c;
    --bg-elevated: rgba(255,255,255,0.06);
    --border: rgba(255,255,255,0.09);
    --text-primary: #f5f5f7;
    --text-muted: #9a9aa2;
    --accent: #D4A056;
    --accent-light: #f0ce94;
    --accent-soft: rgba(212,160,86,0.12);
    --on-accent: #1c1509;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg-deep);
    color: var(--text-primary);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 380px;
    text-align: center;
  }
  .icon-wrap {
    width: 72px;
    height: 72px;
    margin: 0 auto 24px;
    border-radius: 20px;
    background: var(--accent-soft);
    border: 1px solid rgba(212,160,86,0.3);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-wrap svg { width: 32px; height: 32px; color: var(--accent); }
  .wordmark {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    background: linear-gradient(90deg, var(--accent), var(--accent-light));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    margin-bottom: 14px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p {
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.55;
    margin: 0 0 28px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 15px 20px;
    border-radius: 14px;
    font-size: 15.5px;
    font-weight: 700;
    text-decoration: none;
    background: var(--accent);
    color: var(--on-accent);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .btn:active { transform: scale(0.98); }
  .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <div class="icon-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  </div>
  <span class="wordmark">TapGo</span>
  <h1>Esta tarjeta todavía no está activada</h1>
  <p>Es una tarjeta NFC TapGo que aún no ha sido asignada a un negocio. Si eres dueño de un negocio y quieres una activa hoy mismo, escríbenos.</p>
  <a class="btn" href="https://wa.me/523331954765?text=Hola%2C%20encontr%C3%A9%2Fcompr%C3%A9%20una%20tarjeta%20TapGo%20y%20quiero%20activarla%20para%20mi%20negocio" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4c-1.3 0-2.5-.3-3.6-.8L3 20l1-5.7A8.4 8.4 0 1 1 21 11.5z"/></svg>
    Activar por WhatsApp
  </a>
</main>
</body>
</html>
